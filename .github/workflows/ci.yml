name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check SEO files in the build
        run: |
          for f in index.html robots.txt sitemap.xml llms.txt manifest.webmanifest sw.js og-image.png _headers 404.html; do
            test -s "dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done
          grep -q 'property="og:image"' dist/index.html
          ! grep -q '{{SITE_URL}}' dist/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
